name = "sales-mtd-app"
main = "workers/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "sales-mtd-db"
database_id = "sales-mtd-db-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "sales-mtd-files"

[site]
bucket = "./.next/out"
